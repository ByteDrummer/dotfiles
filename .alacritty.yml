# onedark Alacritty Colors
colors:
  # Default colors
  primary:
    background: '0x282c34'
    foreground: '0xabb2bf'

  # Selection colors
  selection:
    text:       CellForeground
    background: '0x393f4a'

  # Normal colors
  normal:
    black:   '0x20232A'
    red:     '0xe86671'
    green:   '0x98c379'
    yellow:  '0xe5c07b'
    blue:    '0x61afef'
    magenta: '0xc678dd'
    cyan:    '0x56b6c2'
    #white:   '0x798294'
    white:   '0xabb2bf'

  # Bright colors
  bright:
    black:   '0x798294'
    red:     '0xe86671'
    green:   '0x98c379'
    yellow:  '0xe5c07b'
    blue:    '0x61afef'
    magenta: '0xc678dd'
    cyan:    '0x56b6c2'
    white:   '0xabb2bf'

  indexed_colors:
    - { index: 16, color: '0xd19a66' }
    - { index: 17, color: '0xf65866' }

font:
  normal:
    family: Hack Nerd Font Mono
    style: Regular

  bold:
    family: Hack Nerd Font Mono
    style: Bold

  italic:
    family: Hack Nerd Font Mono
    style: Italic

  bold_italic:
    family: Hack Nerd Font Mono
    style: Bold Italic

  size: 10.5

window:
  padding:
    x: 10
    y: 10
  decorations: none

env:
  WINIT_X11_SCALE_FACTOR: '1.0'
  TERM: xterm-256color

shell:
  program: /bin/zsh
  args:
    - -l
    - -c
    - "tmux"
