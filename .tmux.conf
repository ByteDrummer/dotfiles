set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file
bind r source-file ~/.tmux.conf

# use Vim keys for pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# rebind action previously used by "l" key
bind P last-window

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

set -g status-bg '#2C323C'
set -g status-fg '#abb2bf'

# fix delay caused by hitting ESC
set -s escape-time 0

# enter copy mode with vi keys
setw -g mode-keys vi
# stop canceling of copy mode when selecting by mouse
unbind-key -T copy-mode-vi MouseDragEnd1Pane
# use v to trigger selection    
bind-key -T copy-mode-vi v send-keys -X begin-selection
# use y to yank current selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# switch session after closing current instead of terminating
set-option -g detach-on-destroy off

# allow OSC52 escape codes through for yanking over ssh
set-option -g set-clipboard on

# set custom status
run-shell ~/tmux_status.tmux
