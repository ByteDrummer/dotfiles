[colors]

focus-dark = #282c34
blue = #61afef
magenta = #c678dd
green = #98c379
orange = #e5c07b
red = #e86671
bg = #31353F
fg = #abb2bf
cyan = #56b6c2
alpha = #00000000
white = #fff

[bar/top]
monitor = ${env:MONITOR:}

override-redirect = false

; Put the bar at the bottom of the screen
bottom = false

; Prefer fixed center position for the `modules-center` block
fixed-center = true

width = 90%
height = 29

; rounded corners
radius = 0

offset-x =  5%
offset-y =  12

; Background ARGB color (e.g. #f00, #ff992a, #ddff1023)
background = ${colors.bg}

; Foreground ARGB color (e.g. #f00, #ff992a, #ddff1023)
foreground = ${colors.fg}

line-size = 2
line-color = #fff

; Number of spaces to add at the beginning/end of the bar
; Individual side values can be defined using:
;   padding-{left,right}
padding-right = 0
padding-left = 0

; Number of spaces to add before/after each module
; Individual side values can be defined using:
;   module-margin-{left,right}
module-margin = 0

font-0 = "Hack Nerd Font Mono:size=18;4"
font-1 = "MesloLGS NF:size=10.5;3"
font-2 = "Cantarell:size=11;4"
; for volume icon
font-3 = "Hack Nerd Font:size=18;4"
; for bell icon
font-4 = "Hack Nerd Font:size=13;4"

tray-position = adaptive

; Define modules fot the bar
; All modules need not be added here
modules-left = powermenu bspwm
modules-center = title
modules-right = backlight sps battery sps pulseaudio sps memory sps cpu sps date sps dunst sps tray
; Following modules are not enabled by default in Endeavour OS Bspwm Edition
;
; 1. mpd - Shows current playing track info.
;          Need to set host and port in module definition.
;
; 2. mpd_control - Shows previous, play/pause, next button to
;                  control music playback via mpd.
;                  Need to set host and port in module definition.
;
; 3. netspeed - Displays real time network speed
;               Need to set correct interface name in module definition.

; The separator will be inserted between the output of each module
separator =

; This value is used to add extra spacing between elements
; @deprecated: This parameter will be removed in an upcoming version
spacing = 0

; Opacity value between 0.0 and 1.0 used on fade in/out
dim-value = 1.0

wm-name = i3

wm-restack = bspwm


enable-ipc = true

;border-left-size = 1%
;border-right-size = 1%
;border-top-size = 1%
;border-bottom-size = 25
border-color = ${colors.alpha}

[module/tray]
type = internal/tray
format = "<tray> "

[module/bspwm]
type = internal/bspwm

; Only show workspaces defined on the same output as the bar
; NOTE: The bspwm and XRandR monitor names must match, which they do by default.
; But if you rename your bspwm monitors with bspc -n this option will no longer
; behave correctly.
; Default: true
pin-workspaces = true

; Output mode flags after focused state label
; Default: false
inline-mode = false

; Create click handler used to focus workspace
; Default: true
enable-click = true

; Create scroll handlers used to cycle workspaces
; Default: true
enable-scroll = false

; Set the scroll cycle direction 
; Default: true
reverse-scroll = false

; Use fuzzy (partial) matching on labels when assigning 
; icons to workspaces
; Example: code;♚ will apply the icon to all workspaces 
; containing 'code' in the label
; Default: false
fuzzy-match = true

; ws-icon-[0-9]+ = <label>;<icon>
; Note that the <label> needs to correspond with the bspwm workspace name
; Neither <label> nor <icon> can contain a semicolon (;)
ws-icon-0 = "1; %{T1}󰇮%{T-} "
ws-icon-1 = "2; %{T1}󰍩%{T-} "
ws-icon-2 = "3; %{T1}󰖟%{T-} "
ws-icon-3 = "4; %{T1}%{T-} "
ws-icon-4 = "5; %{T1}󰊴%{T-} "
ws-icon-5 = "6; %{T1}%{T-} "
ws-icon-6 = "7; %{T1}%{T-} "
ws-icon-7 = "8; %{T1}%{T-} "
ws-icon-8 = "9; %{T1}%{T-} "
ws-icon-9 = "10; %{T1}󰎆%{T-} "
ws-icon-10 = "11; %{T1}%{T-} "
ws-icon-11 = "12; %{T1}%{T-} "
ws-icon-12 = "13; %{T1}%{T-} "
ws-icon-13 = "14; %{T1}%{T-} "
ws-icon-14 = "15; %{T1}%{T-} "
ws-icon-15 = "16; %{T1}%{T-} "
ws-icon-16 = "17; %{T1}%{T-} "
ws-icon-17 = "18; %{T1}%{T-} "
ws-icon-18 = "19; %{T1}%{T-} "
ws-icon-19 = "20; %{T1}%{T-} "
ws-icon-default = " %{T1}%{T-} "

; Available tags:
;   <label-monitor>
;   <label-state> - gets replaced with <label-(focused|urgent|occupied|empty)>
;   <label-mode> - gets replaced with <label-(monocle|tiled|fullscreen|floating|locked|sticky|private)>
; Default: <label-state>
format = <label-state> <label-mode>

; Available tokens:
;   %name%
; Default: %name%
label-monitor = %name%

; If any values for label-dimmed-N are defined, the workspace/mode
; colors will get overridden with those values if the monitor is out of focus
; To only override workspaces in a specific state, use:
;   label-dimmed-focused
;   label-dimmed-occupied
;   label-dimmed-urgent
;   label-dimmed-empty
;label-dimmed-foreground = #474E5E
;label-dimmed-underline = ${bar/top.background}
;label-dimmed-focused-background = ${colors.red}

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
label-focused = %icon%
label-focused-foreground = ${colors.fg}
label-focused-background = ${colors.focus-dark}
label-focused-underline = ${colors.magenta}

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
label-occupied = %icon%
label-occupied-padding = 0
label-occupied-foreground = ${colors.fg}

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
label-urgent = %icon%
label-urgent-foreground = ${colors.red}

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
label-empty = %icon%
label-empty-foreground = #5F677B
label-empty-padding = 0

; Separator in between workspaces
label-separator =
label-separator-padding = 0
label-separator-foreground = #ffb52a

[module/date]
type = internal/date

format = %{T1}󰃰%{T-} <label>
format-foreground = ${colors.magenta}

; Seconds to sleep between updates
interval = 1.0

; See "http://en.cppreference.com/w/cpp/io/manip/put_time" for details on how to format the date string
; NOTE: if you want to use syntax tags here you need to use %%{...}
date = %{T2}%m/%d%{T-}

; Optional time format
time = %{T2} %H:%M%{T-}

; if `date-alt` or `time-alt` is defined, clicking
; the module will toggle between formats
date-alt = %{T2}%Y/%m/%d%{T-}
time-alt = %{T2} %H:%M:%S%{T-}

label = %date%%time%
label-foreground = ${colors.fg}

[module/cpu]
type = internal/cpu

; Seconds to sleep between updates
; Default: 1
interval = 0.5

format = %{T1}󰍛%{T-} <label>
format-foreground = ${colors.blue}

label = %{T2}%percentage:02%%%{T-}
label-foreground = ${colors.fg}

[module/memory]
type = internal/memory

; Seconds to sleep between updates
; Default: 1
interval = 0.5
format = %{T1}%{T-} <label>
format-foreground = ${colors.cyan}

; Available tokens:
;   %percentage_used% (default)
;   %percentage_free%
;   %gb_used%
;   %gb_free%
;   %gb_total%
;   %mb_used%
;   %mb_free%
;   %mb_total%
;   %percentage_swap_used%
;   %percentage_swap_free%
;   %mb_swap_total%
;   %mb_swap_free%
;   %mb_swap_used%
;   %gb_swap_total%
;   %gb_swap_free%
;   %gb_swap_used%

label = %{T2}%percentage_used:02%%%{T-}
label-foreground = ${colors.fg}

[module/mpd]
type = internal/mpd

host = 0.0.0.0
port = 6600

interval = 2

format-online = <label-song>
format-online-background = ${colors.bg}
format-online-foreground = ${colors.blue}
#format-online-padding = 20

label-song =  %{T2}%artist% - %title%%{T-}
label-song-maxlen = 55
label-song-ellipsis = true

label-offline = "MPD is offline"

[module/mpd_control]
type = internal/mpd

interval = 2

format-online = <icon-prev> <toggle> <icon-next>
format-online-background = ${colors.bg}
format-online-foreground = ${colors.blue}
#format-online-padding = 2

label-offline = "MPD is offline"

; Only applies if <icon-X> is used
icon-play = %{T1}奈%{T-}
icon-pause = %{T1}%{T-}
icon-stop = %{T1}%{T-}
icon-prev = %{T1}ﭣ%{T-}
icon-next = %{T1}ﭡ%{T-}

;An empty module used to add 1 unit spacings whenever needed
[module/sps]
type = custom/text
content = " "
content-padding = 0

[module/netspeed]
type = internal/network

; Set correct interface name for the module to work
; Try eth0 for ethernet or wlan0 for wireless
;
; You can also run ifconfig in a terminal
; to know the interace names on your system.
interface = wlan0
interval = 1.0
label-connected = "%{T1}龍%{T-}%{T2} %downspeed% | %upspeed%%{T-}"
label-disconnected = "%{T2}0/0%{T-}"
label-connected-background = ${colors.bg}
label-connected-foreground = ${colors.orange}
label-disconnected-foreground = ${colors.red}

[module/title]
type = internal/xwindow
; Available tags:
;   <label> (default)
format = <label>
format-background = ${colors.bg}
format-foreground = ${colors.fg}
format-padding = 4

; Available tokens:
;   %title%
; Default: %title%
label = "%{T3}%title%%{T-}"
label-maxlen = 65

; Used instead of label when there is no window title
; Available tokens:
;   None
;label-empty =%{T2}EndeavourOS Bspwm%{T-}
label-empty-foreground = #707880

[module/pulseaudio]
type = internal/pulseaudio

; Sink to be used, if it exists (find using `pacmd list-sinks`, name field)
; If not, uses default sink
; sink = alsa_output.pci-0000_12_00.3.analog-stereo
; sink = alsa_output.pci-0000_00_1b.0.analog-stereo

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
; Default: true
use-ui-max = false

; Interval for volume increase/decrease (in percent points)
; Default: 5
interval = 5

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.green}

; Available tags:
;   <label-muted> (default)
;   <ramp-volume>
;   <bar-volume>
format-muted = %{T4}󰝟%{T-} <label-muted>
format-muted-foreground = ${colors.green}

; Available tokens:
;   %percentage% (default)
;   %decibels% (unreleased)
label-volume = %{T2}%percentage:02%%%{T-}
label-volume-foreground = ${colors.fg}

; Available tokens:
;   %percentage% (default)
;   %decibels% (unreleased)
label-muted = %{T2}%percentage:02%%%{T-}
label-muted-foreground = ${colors.fg}

; Only applies if <ramp-volume> is used
ramp-volume-0 = %{T4}󰕿%{T-}
ramp-volume-1 = %{T4}󰖀%{T-}
ramp-volume-2 = %{T4}󰕾%{T-}

; Right and Middle click (unreleased)
click-right = pavucontrol &
; click-middle =

[module/backlight]
type = internal/backlight

; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
card = amdgpu_bl1

; Enable changing the backlight with the scroll wheel
; NOTE: This may require additional configuration on some systems. Polybar will
; write to `/sys/class/backlight/${self.card}/brightness` which requires polybar
; to have write access to that file.
; DO NOT RUN POLYBAR AS ROOT. 
; The recommended way is to add the user to the
; `video` group and give that group write-privileges for the `brightness` file.
; See the ArchWiki for more information:
; https://wiki.archlinux.org/index.php/Backlight#ACPI
; Default: false
enable-scroll = true

; Available tags:
;   <label> (default)
;   <ramp>
;   <bar>
format = <ramp> <label>
format-foreground = ${colors.red}
; Available tokens:
;   %percentage% (default)
label = %{T2}%percentage:02%%%{T-}
label-foreground = ${colors.fg}
ramp-0 = %{T1}%{T-}
ramp-1 = %{T1}%{T-}
ramp-2 = %{T1}%{T-}
ramp-3 = %{T1}%{T-}
ramp-4 = %{T1}%{T-}

[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 15

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.orange}
label-charging = %{T2}%percentage:02%%%{T-}
label-charging-foreground = ${colors.fg}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.orange}
label-discharging = %{T2}%percentage:02%%%{T-}
label-discharging-foreground = ${colors.fg}

format-full = <ramp-capacity> <label-full>
format-full-foreground = ${colors.orange}
label-full = %{T2}%percentage:02%%%{T-}
label-full-foreground = ${colors.fg}

format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.red}
label-low = %{T2}%percentage:02%%%{T-}
label-low-foreground = ${colors.fg}

animation-charging-0 = %{T1}%{T-}
animation-charging-1 = %{T1}%{T-}
animation-charging-2 = %{T1}%{T-}
animation-charging-3 = %{T1}%{T-}
animation-charging-4 = %{T1}%{T-}
animation-charging-framerate = 750

ramp-capacity-0 = %{T1}%{T-}
ramp-capacity-1 = %{T1}%{T-}
ramp-capacity-2 = %{T1}%{T-}
ramp-capacity-3 = %{T1}%{T-}
ramp-capacity-4 = %{T1}%{T-}

[settings]
pseudo-transparency = true

[module/caps]
type = custom/script
interval = 0.5s
exec = ~/.config/polybar/scripts/cns.sh -c
format-foreground = ${colors.orange}

[module/num]
type = custom/script
interval = 0.5s
exec = ~/.config/polybar/scripts/cns.sh -n
format-foreground = ${colors.orange}

[module/scroll]
type = custom/script
interval = 0.5s
exec = ~/.config/polybar/scripts/cns.sh -s
format-foreground = ${colors.orange}

[module/powermenu]
type = custom/ipc
initial = 1
format-foreground = ${colors.blue}

hook-0 = echo " %{T1}%{A1:~/.config/rofi/powermenu.sh:}%{A}%{T-} " &
hook-1 = echo "%{B#282c34} %{T1}%{T-} %{B-}" &

[module/keyhint]
type = custom/text
content = ""
click-left = xfce4-terminal -e "less /home/$USER/.config/bspwm/keybindings"
content-foreground = ${colors.magenta}
content-padding = 1
margin-right = 0

[module/checkupdates]
type = custom/script
interval = 900s
exec = ~/.config/polybar/scripts/checkupdates.sh
format-foreground = ${colors.orange}

[module/dunst]
type = custom/ipc
initial = 1
format-foreground = ${colors.fg}

hook-0 = echo "%{T5}%{A1:dunstctl set-paused true && polybar-msg hook dunst 2:}󰂚%{A}%{T-}" &
hook-1 = echo "%{T5}%{A1:dunstctl set-paused false && polybar-msg hook dunst 1:}󰂛%{A}%{T-}" &
